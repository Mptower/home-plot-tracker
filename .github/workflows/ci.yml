name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Supervisor clones this repository and builds the add-on from it as-is,
      # so the staged tree under addon/rootfs/app is what actually ships. It has
      # to match the sources it was generated from.
      - name: Add-on build context is up to date
        run: npm run check:addon

  addon-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same build Supervisor performs on the Home Assistant machine, with
      # the add-on directory as the context. Catches a broken Dockerfile or a
      # missing staged file before anyone tries to install it.
      - name: Build the add-on image
        run: docker build --tag home-plot-tracker-addon:ci addon

      - name: Run it and check it serves the app
        run: |
          docker run --detach --name hpt --publish 8099:8099 home-plot-tracker-addon:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8099/api/health; then break; fi
            sleep 1
          done
          echo
          curl --silent --fail --output /dev/null http://127.0.0.1:8099/api/health \
            || { echo "::error::the add-on never became healthy"; docker logs hpt; exit 1; }
          curl --silent --fail --output /dev/null http://127.0.0.1:8099/
          curl --silent --fail --output /dev/null http://127.0.0.1:8099/api/seeds

      # A 200 from /api/health already proves @hpt/shared resolved: index.js
      # imports ha/service.js imports ha/frost.js imports @hpt/shared, all at the
      # top level, so a failed resolution kills the process before it listens.
      # These steps make that implicit proof explicit and readable in the log,
      # because the failure mode being guarded against is Julie's garden
      # vanishing from her sidebar.
      - name: Show how the catalogue is on disk
        run: |
          echo '--- /app ---'
          docker exec hpt ls -l /app
          echo '--- /app/shared ---'
          docker exec hpt ls -l /app/shared
          echo '--- /app/node_modules/@hpt (the symlink npm ci created) ---'
          docker exec hpt ls -l /app/node_modules/@hpt
          echo '--- resolved package.json ---'
          docker exec hpt cat /app/node_modules/@hpt/shared/package.json

      # The staging script flattens shared/dist to /app/shared because .gitignore
      # matches the bare names `dist` and `node_modules` at any depth. A nested
      # one would be committed on the build machine and absent from the clone
      # Supervisor builds, so assert the flattening survived into the image.
      - name: No directory the git clone would have eaten
        run: |
          found=$(docker exec hpt find /app/shared /app/server /app/client \
            -name node_modules -o -name dist)
          if [ -n "$found" ]; then
            echo "::error::staged tree contains a git-ignored directory name:"
            echo "$found"
            exit 1
          fi
          echo "none, as expected"

      # The actual feature, exercised against the compiled files in the image:
      # a variety with no seed packet behind it still resolves to a crop family,
      # and a packet filed under the wrong family is still treated as tender.
      # This is the import that would have crashed the add-on on boot.
      - name: The frost engine can place a plant with no seed packet
        run: |
          docker exec --workdir /app/server hpt node --input-type=module --eval "
            const { buildCategoryLookup } = await import('/app/server/ha/varietyCategory.js');
            const { tendernessOf } = await import('@hpt/shared');
            const lookup = buildCategoryLookup([]);
            for (const variety of ['Sugar Baby Watermelon', 'cherry tomatoes', 'Who Knows']) {
              const category = lookup(variety);
              console.log(variety, '->', category, '->', tendernessOf(category ?? ''));
            }
            if (lookup('Sugar Baby Watermelon') !== 'Cucurbit') throw new Error('catalogue fallback is not working in the image');
            if (lookup('Who Knows') !== null) throw new Error('the resolver is guessing');
          "

      # Julie's literal row, in the image she actually installs: a cherry tomato
      # filed as a Leafy Green. The category stays as she filed it — the vault
      # and the rotation reminder read that — while the frost engine takes the
      # more tender of her filing and an exact catalogue match, so the warning
      # she was not getting now happens. The kale line is the control: filed the
      # same way, genuinely hardy, still hardy.
      - name: A miscategorised packet is still treated as tender
        run: |
          docker exec --workdir /app/server hpt node --input-type=module --eval "
            const { buildCategoryLookup, buildTendernessLookup } = await import('/app/server/ha/varietyCategory.js');
            const seeds = [
              { id: 's1', variety: 'Cherry Tomato', category: 'Leafy Green', brand: '', purchaseYear: 2026, notes: '' },
              { id: 's2', variety: 'Kale', category: 'Leafy Green', brand: '', purchaseYear: 2026, notes: '' },
            ];
            const categoryOf = buildCategoryLookup(seeds);
            const tendernessAt = buildTendernessLookup(seeds);
            for (const variety of ['Cherry Tomato', 'cherry tomatoes', 'Kale', 'Who Knows']) {
              console.log(variety, '-> filed', categoryOf(variety), '-> frost', tendernessAt(variety));
            }
            if (categoryOf('Cherry Tomato') !== 'Leafy Green') throw new Error('her filing was rewritten, which it must never be');
            if (tendernessAt('Cherry Tomato') !== 'tender') throw new Error('her tomato would go unwarned at frost');
            if (tendernessAt('cherry tomatoes') !== 'tender') throw new Error('a plural square would go unwarned at frost');
            if (tendernessAt('Kale') !== 'hardy') throw new Error('the safety bias is over-reaching onto genuinely hardy plants');
            if (tendernessAt('Who Knows') !== 'unknown') throw new Error('the resolver is guessing');
          "

      - name: Add-on log
        if: always()
        run: docker logs hpt || true

      - name: Stop it
        if: always()
        run: docker rm --force hpt || true
