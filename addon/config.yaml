# The Home Plot Tracker — Home Assistant add-on
#
# Ingress-only by design. There is deliberately no `ports:` mapping: the app has
# no authentication of its own, so every request must arrive through HA's
# ingress proxy, which has already authenticated the user's HA session.
name: The Home Plot Tracker
slug: home_plot_tracker
version: "0.2.0"
description: Plan garden beds, catalogue seed packets and log every harvest, alongside the rest of your home.
url: https://github.com/Mptower/home-plot-tracker
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# The image is a plain Node runtime rather than an s6-overlay base, so there is
# no supervisory init to hand off to. run.sh execs Node as PID 1 and the server
# handles SIGTERM itself, closing SQLite cleanly on stop.
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:sprout
panel_title: Garden
panel_admin: false
# /data is mounted automatically and is the volume HA's own backups snapshot,
# so the SQLite database is included in every backup with no configuration.
# `hot` would back the file up while it is open; stopping the add-on first
# checkpoints the WAL into the .db file, so take the cold copy.
backup: cold
# Grants a Supervisor-issued Home Assistant API token as SUPERVISOR_TOKEN, which
# is what lets the add-on read the weather forecast, publish the harvest sensors
# and send a frost notification. Everything it enables is server-side: the token
# is never exposed to the browser, and the client is given one purpose-built
# endpoint containing only what it needs to draw the frost banner.
#
# Without this the integration does not merely fail — it never starts. The
# absence of SUPERVISOR_TOKEN is exactly how the app runs on a laptop.
homeassistant_api: true
# Defaults are the entities on the installation this was built for. They are
# options rather than constants so that renaming an entity in Home Assistant is
# a settings change here, not a code change.
options:
  weather_entity: weather.forecast_home
  notify_service: notify.mobile_app_julie_s_phone
  sensor_prefix: garden
  frost_notifications: true
  quiet_hours_start: "21:00"
  quiet_hours_end: "07:00"
schema:
  # A weather entity that supports forecasts. The add-on calls
  # weather.get_forecasts rather than reading state attributes, because
  # forecasts stopped being attributes in Home Assistant 2024.4.
  weather_entity: str
  # Any notify service. To stop the phone notification while keeping the in-app
  # banner and the sensors, use frost_notifications below — blanking this falls
  # back to the default rather than disabling anything.
  notify_service: str
  # Prefix for the four published sensors, e.g. sensor.garden_harvest_weight.
  # Change it if those ids are already taken; the add-on will not overwrite an
  # entity it did not create.
  sensor_prefix: str
  frost_notifications: bool
  # 24-hour local time. No notification is sent inside this window unless the
  # frost lands within twelve hours, which is close enough that waiting until
  # morning would be too late to cover anything.
  quiet_hours_start: str
  quiet_hours_end: str
